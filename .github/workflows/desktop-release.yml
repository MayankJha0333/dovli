# Builds Dovli for Mac and Windows and uploads the installers to a draft GitHub release.
#
# - Push a tag like desktop-v0.2.0 (it must match apps/desktop/package.json "version"), or run it by
#   hand (Actions → Desktop release → Run workflow) to build without a tag.
# - The release stays a draft. Publish it on GitHub when you're happy: only then do people get it,
#   including through the app's own auto-update (which reads published releases).
#
# One-time setup, outside this repo (Settings → Secrets and variables → Actions):
#   Variables (public, the same as the web app's): NEXT_PUBLIC_FIREBASE_API_KEY, _AUTH_DOMAIN,
#     _PROJECT_ID, _APP_ID, _STORAGE_BUCKET, _MESSAGING_SENDER_ID.
#   Secrets, optional until you have the certificates (without them the apps are unsigned, and Mac
#   and Windows warn people when they open them):
#     MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD   Developer ID Application certificate (.p12, base64)
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarizing
#     WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD   Windows code-signing certificate (.pfx, base64)

name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version."
            exit 1
          fi
      - run: pnpm --filter @dovli/desktop typecheck
      - run: pnpm --filter @dovli/desktop test
      - run: pnpm --filter @dovli/sync test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Mac, os: macos-latest, target: --mac }
          - { name: Windows, os: windows-latest, target: --win }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Without the Firebase settings the app would have no sign-in
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ] || [ -z "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Set the NEXT_PUBLIC_FIREBASE_* repository variables first (see the top of this file)."
            exit 1
          fi
      - run: pnpm --filter @dovli/desktop build

      # Signing secrets are passed only when they exist; electron-builder signs when it finds them.
      - name: Package and upload to the draft release
        shell: bash
        working-directory: apps/desktop
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          elif [ -n "$WIN_LINK" ]; then
            export WIN_CSC_LINK="$WIN_LINK" WIN_CSC_KEY_PASSWORD="$WIN_PASSWORD"
          fi
          npx electron-builder ${{ matrix.target }} --publish always
